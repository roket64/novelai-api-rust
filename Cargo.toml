[package]
name = "novelai-api-rust"
version = "0.1.0"
edition = "2021"

[lib]
name="novelapi_lib"
path="src/lib.rs"

[[bin]]
name="novelapi_bin"
path="src/main.rs"

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
blake2 = "0.10.6"
dotenv = "0.15.0"
log = "0.4.27"
log4rs = "1.3.0"
reqwest = { version = "0.12.15", features = ["json"] }
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
zip = "3.0.0"
